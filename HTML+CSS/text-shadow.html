<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: rgb(231, 24, 24);
            text-align:center;
            transition: all 5s;
        }
        .box:hover{
            background-color: rgb(15, 31, 207);
            transform:translateX(500px) translateY(500px);
        }
    </style>
</head>
<body>
    <div class="box">
        this is a box
    </div>
</body>
</html>
