
<!DOCTYPE html>
<html>
<head>
    <title>Whack a Mole</title>
</head>
<body>

    <h2>Whack a Mole Game</h2>
    <p>Click on the mole to score points!</p>

    <h3>Score: <span id="score">0</span></h3>

    <button onclick="startGame()">Start Game</button>

    <br><br>

    <div>
        <button id="1" onclick="hit(1)">Hole 1</button>
        <button id="2" onclick="hit(2)">Hole 2</button>
        <button id="3" onclick="hit(3)">Hole 3</button>
    </div>

    <br>

    <div>
        <button id="4" onclick="hit(4)">Hole 4</button>
        <button id="5" onclick="hit(5)">Hole 5</button>
        <button id="6" onclick="hit(6)">Hole 6</button>
    </div>

    <br>

    <div>
        <button id="7" onclick="hit(7)">Hole 7</button>
        <button id="8" onclick="hit(8)">Hole 8</button>
        <button id="9" onclick="hit(9)">Hole 9</button>
    </div>

    <script>
        let score = 0;
        let mole = 0;
        let timer;

        function startGame() {
            score = 0;
            document.getElementById("score").innerHTML = score;

            clearInterval(timer);
            showMole();

            timer = setInterval(showMole, 1000);
        }

        function showMole() {
            for (let i = 1; i <= 9; i++) {
                document.getElementById(i).innerHTML = "Hole " + i;
            }

            mole = Math.floor(Math.random() * 9) + 1;

            document.getElementById(mole).innerHTML = "🥸🤣🤡😠"; //"🐹"
        }

        function hit(n) {
            if (n == mole) {
                score++;
                document.getElementById("score").innerHTML = score;

                document.getElementById(n).innerHTML = "Hole " + n;
                mole = 0;
            }
        }
    </script>

</body>
</html>
