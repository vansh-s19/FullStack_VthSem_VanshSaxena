<body>
    <script>
        let scores = [85, 90, 78, 92, 80];

        let total = 0;

        for (let i = 0; i < scores.length; i++) {
            total += scores[i];
        }

        let average = total / scores.length;

        console.log("Total Marks: " + total);
        console.log("Average Score: " + average);
    </script>
</body>
